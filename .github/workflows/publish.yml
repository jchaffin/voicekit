name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish workspaces
        shell: bash
        run: |
          TAG=latest
          if [[ "${{ github.event.release.tag_name }}" == *-* ]]; then
            TAG=alpha
          fi
          npm publish --workspaces --tag "$TAG"
          npm publish --tag "$TAG"
