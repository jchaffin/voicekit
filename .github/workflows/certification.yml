name: Provider Certification

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      fixture_modules:
        description: Space-separated certification fixture modules
        required: false
        type: string

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -w @jchaffin/voicekit-conformance
      - name: Run configured live certifications
        if: ${{ inputs.fixture_modules != '' || vars.VOICEKIT_CERTIFICATION_MODULES != '' }}
        env:
          FIXTURE_MODULES: ${{ inputs.fixture_modules || vars.VOICEKIT_CERTIFICATION_MODULES }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: npx voicekit-certify $FIXTURE_MODULES
